syntax = "proto3";

package openchain.v1;

option go_package = "github.com/openchain/openchain/apps/backend/gen/proto/openchain/v1;openchainv1";

enum Network {
  NETWORK_UNSPECIFIED = 0;
  NETWORK_ETHEREUM_MAINNET = 1;
  NETWORK_BASE_MAINNET = 2;
  NETWORK_SOLANA_MAINNET = 3;
  NETWORK_TRON_MAINNET = 4;
  NETWORK_POLYGON_MAINNET = 5;
  NETWORK_ARBITRUM_ONE = 6;
  NETWORK_OPTIMISM_MAINNET = 7;
  NETWORK_BNB_CHAIN = 8;
  NETWORK_TON_MAINNET = 9;
  NETWORK_CARDANO_MAINNET = 10;
}

message SourceStatus {
  string source = 1;
  int64 retrieved_at = 2;
  int64 indexed_up_to_block = 3;
  int64 latest_chain_block = 4;
  bool is_complete = 5;
  string warning = 6;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_EOA = 1;
  ENTITY_TYPE_CONTRACT = 2;
  ENTITY_TYPE_EXCHANGE = 3;
  ENTITY_TYPE_MIXER = 4;
  ENTITY_TYPE_BRIDGE = 5;
  ENTITY_TYPE_DEFI_POOL = 6;
}

message Asset {
  string kind = 1; // NATIVE or ERC20
  string contract_address = 2; // empty for native ETH
  string symbol = 3;
  uint32 decimals = 4;
}

message AddressSummary {
  string address = 1;
  Network network = 2;
  EntityType entity_type = 3;
  string label = 4;
  string balance_base_units = 5;
  string balance_formatted = 6;
  uint64 tx_count = 7;
  int64 first_seen_timestamp = 8;
  int64 last_seen_timestamp = 9;
  string total_received_base_units = 10;
  string total_sent_base_units = 11;
}

message TokenBalance {
  string contract_address = 1;
  string symbol = 2;
  string name = 3;
  uint32 decimals = 4;
  string raw_balance = 5;
  string formatted_balance = 6;
}
