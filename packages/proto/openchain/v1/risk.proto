syntax = "proto3";

package openchain.v1;

import "openchain/v1/common.proto";

option go_package = "github.com/openchain/openchain/apps/backend/gen/proto/openchain/v1;openchainv1";

message RiskFlag {
  string rule_id = 1;
  string rule_name = 2;
  string severity = 3; // LOW, MEDIUM, HIGH, CRITICAL
  double score_impact = 4;
  string description = 5;
  string evidence_detail = 6;
}

message RiskEvaluation {
  string address = 1;
  Network network = 2;
  double total_score = 3; // 0.0 to 100.0
  string risk_level = 4;  // LOW, MEDIUM, HIGH, SEVERE
  repeated RiskFlag flags = 5;
  int64 evaluated_at = 6;
}

message EvaluateRiskRequest {
  string address = 1;
  Network network = 2;
}

message EvaluateRiskResponse {
  RiskEvaluation evaluation = 1;
}

service RiskService {
  rpc EvaluateRisk(EvaluateRiskRequest) returns (EvaluateRiskResponse);
}
