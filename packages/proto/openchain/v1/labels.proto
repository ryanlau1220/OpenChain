syntax = "proto3";

package openchain.v1;

import "openchain/v1/common.proto";

option go_package = "github.com/openchain/openchain/apps/backend/gen/proto/openchain/v1;openchainv1";

enum TrustTier {
  TRUST_TIER_UNSPECIFIED = 0;
  TRUST_TIER_1_AUTHORITATIVE = 1;
  TRUST_TIER_2_COMMUNITY_VERIFIED = 2;
  TRUST_TIER_3_LOCAL_WORKSPACE = 3;
}

enum LabelVisibility {
  LABEL_VISIBILITY_UNSPECIFIED = 0;
  LABEL_VISIBILITY_PUBLIC = 1;
}

message Attestation {
  string attestation_type = 1;
  string reference_url = 2;
  string proof_hash = 3;
  int64 timestamp = 4;
}

message AddressLabel {
  string id = 1;
  string address = 2;
  Network network = 3;
  string category = 4;
  string label = 5;
  double confidence = 6;
  string evidence_url = 7;
  string source = 8;
  string created_by = 9;
  int64 created_at = 10;
  TrustTier trust_tier = 11;
  repeated Attestation attestations = 12;
  string source_version = 13;
  LabelVisibility visibility = 14;
}

message GetLabelsRequest {
  string address = 1;
  Network network = 2;
}

message GetLabelsResponse {
  repeated AddressLabel labels = 1;
}

message SearchLabelsRequest {
  string query = 1;
  string category = 2;
  uint32 limit = 3;
}

message SearchLabelsResponse {
  repeated AddressLabel labels = 1;
}

service LabelService {
  rpc GetLabels(GetLabelsRequest) returns (GetLabelsResponse);
  rpc SearchLabels(SearchLabelsRequest) returns (SearchLabelsResponse);
}
