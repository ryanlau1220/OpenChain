syntax = "proto3";

package openchain.v1;

import "openchain/v1/common.proto";
import "openchain/v1/labels.proto";

option go_package = "github.com/openchain/openchain/apps/backend/gen/proto/openchain/v1;openchainv1";

message GraphNode {
  string id = 1; // address
  string label = 2;
  EntityType entity_type = 3;
  bool is_seed = 6;
  repeated AssetVolume total_volume_by_asset = 7;
  uint32 in_tx_count = 8;
  uint32 out_tx_count = 9;
  repeated AddressLabel labels = 10;
}

// A node's observed transfer volume for one exact asset in the retrieved graph.
// Amounts from different assets are never combined without valuation evidence.
message AssetVolume {
  Asset asset = 1;
  string amount_base_units = 2;
}

message GraphEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string amount_base_units = 4;
  string amount_formatted = 5;
  uint32 tx_count = 6;
  Asset asset = 7;
  int64 first_tx_timestamp = 8;
  int64 last_tx_timestamp = 9;
  string event_id = 10; // provider log index, trace ID, or transaction event key
  uint64 block_number = 11;
  string transaction_hash = 12;
  string transfer_kind = 13; // NATIVE, INTERNAL, or ERC20
  string source_name = 14;
  int64 retrieved_at = 15;
  bool provisional = 16;
  string block_hash = 17;
}

// A reproducible, neutral observation made by a versioned deterministic rule.
// It is an investigative lead, not an attribution or a risk assessment.
message InvestigationLead {
  string id = 1;
  string rule_id = 2;
  string rule_version = 3;
  string title = 4;
  string subject_address = 5;
  repeated string transfer_ids = 6;
  string rationale = 7;
  string limitations = 8;
  string parameters_json = 9;
}

// A bridge continuation requires a bridge-specific event or message identifier
// and a canonical token route. It records transfer evidence only; it never
// asserts that addresses on the two chains share an owner.
message CrossChainTransition {
  string id = 1;
  string bridge_name = 2;
  Network source_network = 3;
  Network destination_network = 4;
  string source_transfer_id = 5;
  string destination_transfer_id = 6;
  string source_transaction_hash = 7;
  string destination_transaction_hash = 8;
  Asset asset = 9;
  string amount_base_units = 10;
  int64 source_timestamp = 11;
  int64 destination_timestamp = 12;
  string source_bridge_address = 13;
  string destination_bridge_address = 14;
  string limitations = 15;
  // The protocol-specific adapter that established this continuation.
  string protocol = 16;
  // A bridge-specific, deterministic identifier. For the Base standard bridge
  // this is the versioned OP Stack cross-domain message hash.
  string message_id = 17;
  // The exact source-to-destination token route from the adapter registry.
  string canonical_source_token = 18;
  string canonical_destination_token = 19;
  // Recipient encoded in the verified bridge message. It is not an ownership claim.
  string recipient = 20;
  string source_log_reference = 21;
  string destination_log_reference = 22;
  uint64 source_block_number = 23;
  uint64 destination_block_number = 24;
  bool source_confirmed = 25;
  bool destination_confirmed = 26;
  BridgeLifecycle lifecycle = 27;
  repeated uint64 source_acquisition_ids = 28;
  repeated uint64 destination_acquisition_ids = 29;
}

// Lifecycle is a record of bridge-message evidence, not a conclusion about
// wallet ownership, intent, or a complete cross-chain transaction history.
enum BridgeLifecycle {
  BRIDGE_LIFECYCLE_UNSPECIFIED = 0;
  BRIDGE_LIFECYCLE_INITIATED = 1;
  BRIDGE_LIFECYCLE_RELAYED = 2;
  BRIDGE_LIFECYCLE_FINALIZED = 3;
  BRIDGE_LIFECYCLE_FAILED = 4;
  BRIDGE_LIFECYCLE_UNRESOLVED = 5;
}

// Counterparty selection is deterministic and scoped to the provider page.
// "total raw amount" ranks counterparties independently for each exact asset; it is never a fiat valuation.
// "known entity" means a curated label exists; it is not a risk score.
enum GraphRanking {
  GRAPH_RANKING_UNSPECIFIED = 0;
  GRAPH_RANKING_MOST_RECENT = 1;
  GRAPH_RANKING_TOTAL_RAW_AMOUNT = 2;
  GRAPH_RANKING_MOST_ACTIVE = 3;
  GRAPH_RANKING_KNOWN_ENTITY = 4;
}

message TraceGraphRequest {
  string seed_address = 1;
  Network network = 2;
  TraceDirection direction = 3;
  uint32 limit = 4;
  string cursor = 5;
  bool retry = 6;
  uint32 max_counterparties = 7;
  GraphRanking ranking = 8;
  uint32 max_depth = 9;
}

message TraceGraphResponse {
  string seed_address = 1;
  repeated GraphNode nodes = 2;
  repeated GraphEdge edges = 3;
  uint32 total_nodes = 4;
  uint32 total_edges = 5;
  string next_cursor = 6;
  bool has_more = 7;
  SourceStatus source_status = 8;
  bool pending = 9;
  repeated InvestigationLead leads = 10;
  repeated CrossChainTransition cross_chain_transitions = 11;
  TraceCoverage coverage = 12;
}

// Coverage distinguishes the fresh provider page from the durable AGE graph.
// Provider completeness concerns the returned page, not the address's full history.
message TraceCoverage {
  uint32 requested_page_size = 1;
  uint32 observed_transfer_count = 2;
  // Current-page transfers selected for deterministic rules before AGE traversal.
  uint32 rule_input_transfer_count = 3;
  uint32 confirmation_backed_transfer_count = 4;
  uint32 provisional_transfer_count = 5;
  string cursor = 6;
  bool has_more = 7;
  bool provider_complete = 8;
  string limitation = 9;
  // Time the current provider page was fetched. Edge retrieved_at values can be older.
  int64 fresh_retrieved_at = 10;
  uint32 stored_graph_transfer_count = 11;
  // Durable graph edges that were not inputs to this fresh rule evaluation.
  uint32 stored_history_transfer_count = 12;
  int64 stored_oldest_retrieved_at = 13;
  int64 stored_newest_retrieved_at = 14;
  string rule_input_scope = 15;
}

// TraceStatusRequest only reads the durable job created by TraceGraph or
// ExpandNode. It never creates work or retries a failed trace.
message TraceStatusRequest {
  string address = 1;
  Network network = 2;
  TraceDirection direction = 3;
  uint32 limit = 4;
  string cursor = 5;
  uint32 max_counterparties = 6;
  GraphRanking ranking = 7;
  uint32 max_depth = 8;
}

message ExpandNodeRequest {
  string node_address = 1;
  Network network = 2;
  TraceDirection direction = 3;
  uint32 limit = 4;
  string cursor = 5;
  bool retry = 6;
  uint32 max_counterparties = 7;
  GraphRanking ranking = 8;
  uint32 max_depth = 9;
}

message ExpandNodeResponse {
  repeated GraphNode new_nodes = 1;
  repeated GraphEdge new_edges = 2;
  string next_cursor = 3;
  bool has_more = 4;
  SourceStatus source_status = 5;
  bool pending = 6;
  repeated InvestigationLead leads = 7;
  repeated CrossChainTransition cross_chain_transitions = 8;
  TraceCoverage coverage = 9;
}

service TracingService {
  rpc TraceGraph(TraceGraphRequest) returns (TraceGraphResponse);
  rpc GetTraceStatus(TraceStatusRequest) returns (TraceGraphResponse);
  rpc ExpandNode(ExpandNodeRequest) returns (ExpandNodeResponse);
}
enum TraceDirection {
  TRACE_DIRECTION_UNSPECIFIED = 0;
  TRACE_DIRECTION_BOTH = 1;
  TRACE_DIRECTION_INBOUND = 2;
  TRACE_DIRECTION_OUTBOUND = 3;
}
