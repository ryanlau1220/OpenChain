name: openchain-production

services:
  postgres:
    image: apache/age@sha256:4241e2d8bb86a6b2ea44e9ad06c73856e12b209de295124603a599dd7feb70eb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openchain}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openchain} -d ${POSTGRES_DB:-openchain}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: &rotated-logs
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app]

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    environment:
      PORT: "8091"
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-openchain_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-openchain}?sslmode=disable
      ETHEREUM_MAINNET_RPC_URL: ${ETHEREUM_MAINNET_RPC_URL:?ETHEREUM_MAINNET_RPC_URL is required}
      BASE_MAINNET_RPC_URL: ${BASE_MAINNET_RPC_URL:?BASE_MAINNET_RPC_URL is required}
      SOLANA_MAINNET_RPC_URL: ${SOLANA_MAINNET_RPC_URL:?SOLANA_MAINNET_RPC_URL is required}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:?ETHERSCAN_API_KEY is required}
      BLOCKSCOUT_API_KEY: ${BLOCKSCOUT_API_KEY:?BLOCKSCOUT_API_KEY is required}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:?ALCHEMY_API_KEY is required}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:?TRONGRID_API_KEY is required}
      TONAPI_KEY: ${TONAPI_KEY:?TONAPI_KEY is required}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID:?BLOCKFROST_PROJECT_ID is required}
      WEB_ORIGIN: https://${OPENCHAIN_PUBLIC_HOST:?OPENCHAIN_PUBLIC_HOST is required}
      PUBLIC_REQUESTS_PER_MINUTE: ${PUBLIC_REQUESTS_PER_MINUTE:-30}
      MAX_QUEUED_TRACE_JOBS_PER_NETWORK: ${MAX_QUEUED_TRACE_JOBS_PER_NETWORK:-25}
      MAX_QUEUED_TRACE_JOBS_PER_CLIENT_PER_NETWORK: ${MAX_QUEUED_TRACE_JOBS_PER_CLIENT_PER_NETWORK:-3}
      QUEUE_CLIENT_SECRET: ${QUEUE_CLIENT_SECRET:?QUEUE_CLIENT_SECRET is required}
      TRUST_PROXY: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *rotated-logs
    networks:
      app:
      egress:
      proxy:
        aliases: [openchain-backend]

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: "no"
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-openchain_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-openchain}?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-openchain}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-openchain}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *rotated-logs
    networks: [app]

  provider-acceptance:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    profiles: [manual]
    command: ["/app/provideracceptance"]
    environment:
      ETHEREUM_MAINNET_RPC_URL: ${ETHEREUM_MAINNET_RPC_URL:?ETHEREUM_MAINNET_RPC_URL is required}
      BASE_MAINNET_RPC_URL: ${BASE_MAINNET_RPC_URL:?BASE_MAINNET_RPC_URL is required}
      SOLANA_MAINNET_RPC_URL: ${SOLANA_MAINNET_RPC_URL:?SOLANA_MAINNET_RPC_URL is required}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:?ETHERSCAN_API_KEY is required}
      BLOCKSCOUT_API_KEY: ${BLOCKSCOUT_API_KEY:?BLOCKSCOUT_API_KEY is required}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:?ALCHEMY_API_KEY is required}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:?TRONGRID_API_KEY is required}
      TONAPI_KEY: ${TONAPI_KEY:?TONAPI_KEY is required}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID:?BLOCKFROST_PROJECT_ID is required}
      QUEUE_CLIENT_SECRET: ${QUEUE_CLIENT_SECRET:?QUEUE_CLIENT_SECRET is required}
    logging: *rotated-logs
    networks: [egress]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    logging: *rotated-logs
    networks:
      app:
      proxy:
        aliases: [openchain-web]

  node-exporter:
    image: quay.io/prometheus/node-exporter@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ../.metrics:/textfile:ro
    logging: *rotated-logs
    networks: [app]

  telegraf:
    image: telegraf@sha256:cf9c35ee62e73129a1cb2b2ea425e573298ae8f03be8edfaeaffa6aa8cfb3869
    restart: unless-stopped
    user: "telegraf:${DOCKER_GID:?DOCKER_GID is required}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    logging: *rotated-logs
    networks: [app]

  prometheus:
    image: prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    logging: *rotated-logs
    networks: [app]

  grafana:
    image: grafana/grafana@sha256:0a2874cf39c6487093c682215f7c7903ed8646d78ae5f911af945d2dfcc0a447
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: openchain
      GF_SECURITY_ADMIN_PASSWORD: ${OPENCHAIN_GRAFANA_ADMIN_PASSWORD:?OPENCHAIN_GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    logging: *rotated-logs
    networks: [app]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  app:
    internal: true
  egress:
  proxy:
    external: true
    name: proxy-manager_default
