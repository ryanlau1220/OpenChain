name: openchain-production

services:
  postgres:
    image: apache/age@sha256:4241e2d8bb86a6b2ea44e9ad06c73856e12b209de295124603a599dd7feb70eb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openchain}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openchain} -d ${POSTGRES_DB:-openchain}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [app]

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    environment:
      PORT: "8091"
      DATABASE_URL: postgres://${POSTGRES_USER:-openchain}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-openchain}?sslmode=disable
      ETHEREUM_MAINNET_RPC_URL: ${ETHEREUM_MAINNET_RPC_URL:?ETHEREUM_MAINNET_RPC_URL is required}
      BASE_MAINNET_RPC_URL: ${BASE_MAINNET_RPC_URL:?BASE_MAINNET_RPC_URL is required}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:?ETHERSCAN_API_KEY is required}
      BLOCKSCOUT_API_KEY: ${BLOCKSCOUT_API_KEY:?BLOCKSCOUT_API_KEY is required}
      WEB_ORIGIN: https://${OPENCHAIN_PUBLIC_HOST:?OPENCHAIN_PUBLIC_HOST is required}
      PUBLIC_REQUESTS_PER_MINUTE: ${PUBLIC_REQUESTS_PER_MINUTE:-30}
      MAX_QUEUED_TRACE_JOBS: ${MAX_QUEUED_TRACE_JOBS:-25}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, egress]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    networks: [app]

  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OPENCHAIN_PUBLIC_HOST: ${OPENCHAIN_PUBLIC_HOST:?OPENCHAIN_PUBLIC_HOST is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - web
    networks: [app, edge]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  app:
    internal: true
  egress:
  edge:
