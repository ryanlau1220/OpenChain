# Managed by OpenChain edge protection. Do not edit on the host.
#
# An empty key is not rate limited by nginx. This limits only OpenChain's
# public REST and RPC routes while this NPM instance can continue serving its
# other proxy hosts normally.
map "$host:$uri" $openchain_edge_api_key {
    default "";
    ~^__OPENCHAIN_PUBLIC_HOST_REGEX__:/api(?:/|$) $binary_remote_addr;
    ~^__OPENCHAIN_PUBLIC_HOST_REGEX__:/openchain\.v1(?:\.|/|$) $binary_remote_addr;
}

limit_req_zone $openchain_edge_api_key zone=openchain_api_rate:10m rate=__PUBLIC_REQUESTS_PER_MINUTE__r/m;
limit_conn_zone $openchain_edge_api_key zone=openchain_api_connections:10m;
