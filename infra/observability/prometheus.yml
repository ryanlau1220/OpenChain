global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: openchain-backend
    static_configs:
      - targets: [backend:8091]

  - job_name: openchain-node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: openchain-containers
    static_configs:
      - targets: [telegraf:9273]
