services:
  postgres:
    image: apache/age:latest
    container_name: openchain-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openchain_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openchain}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openchain} -d ${POSTGRES_DB:-openchain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  trueblocks:
    image: openchain-trueblocks
    build:
      context: ./trueblocks
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      TRUEBLOCKS_RPC_URL: ${ETHEREUM_MAINNET_RPC_URL:?ETHEREUM_MAINNET_RPC_URL is required}
      TRUEBLOCKS_INIT_MODE: ${TRUEBLOCKS_INIT_MODE:-filters}
    volumes:
      - trueblocks-data:/var/lib/trueblocks
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status?healthcheck=true >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  trueblocks-data:
    name: openchain-trueblocks-data
