services:
  postgres:
    image: apache/age@sha256:4241e2d8bb86a6b2ea44e9ad06c73856e12b209de295124603a599dd7feb70eb
    container_name: openchain-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openchain_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openchain}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openchain} -d ${POSTGRES_DB:-openchain}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
